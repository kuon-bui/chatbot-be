version: '3'

services:
  app:
    build: 
      context: .
      target: dev
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - mongo
      - redis
      - minio
    volumes:
      - ./node_modules:/app/node_modules
      - ./:/app/
    networks:
      - app-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:latest
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis-data:/data
    networks:
      - app-network

  minio:
    image: cuongbui1203/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - 9090:9000
      - 9001:9001
    volumes:
      - ./data/minio-data:/data
    networks:
      - app-network
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - 5540:5540
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
